[project]
name = "gridwise"
version = "0.1.0"
description = "Cheapest and greenest time to use electricity in Denmark. MCP server + Claude agent on Energinet's Energi Data Service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "pandas>=2.0"]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[project.scripts]
gridwise-mcp = "gridwise.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gridwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
